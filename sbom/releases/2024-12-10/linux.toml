# Linux x64 package of build 2024-12-10 (build-vips 7a7f992, decart 2.7.5).
#
# Every file in the archive must match exactly one component's `files`
# globs; sbom.py fails otherwise. Built-from-source versions come from the
# per-dependency scripts at 7a7f992 (git show 7a7f992:build-linux/build/<dep>.sh).
# Ubuntu revisions were pinned by `sbom.py resolve-debs`, which matches the
# shipped bytes against the focal packages on Launchpad.

[sbom]
name = "LibVIPS-linux-x64"
version = "2024-12-10"
description = "libvips 8.15.2 with openslide 2024-12-10 and dependencies, Linux x86_64, as distributed in decart 2.7.5 (convert/)."
output = "SBOM-LibVIPS-linux-x64-8.15.2-2024-12-10.cdx.json"

[archive]
file = "vips-linux-2024-12-10.tar.gz"
url = "s3://build.aixmed.com/vips/vips-linux-2024-12-10.tar.gz"
sha256 = "909b4b9f268ad2d61e14bd77200863c9a832d3a24765c85701c2ead812e097f3"
scope = ""  # decart install.sh extracts the whole archive into convert/

[debian]
distro = "ubuntu-20.04"
series = "focal"

[properties]
build-image = "ubuntu:focal (build-linux/container/Dockerfile at 7a7f992)"

# ---- built from source at 7a7f992 ----------------------------------------

[[component]]
name = "libvips"
version = "8.15.2"
license = "LGPL-2.1-or-later"
purl = "pkg:github/libvips/libvips@v8.15.2"
source = "https://github.com/libvips/libvips/releases/download/v8.15.2/vips-8.15.2.tar.xz"
files = ["vips", "vipsheader", "libvips.so*", "libvips-cpp.so*"]

  [[component.static]]
  name = "libnsgif"
  version = "git-2023-01-22"
  license = "MIT"
  purl = "pkg:generic/libnsgif@git-2023-01-22?vcs_url=git%3A%2F%2Fgit.netsurf-browser.org%2Flibnsgif.git"
  vcs = "git://git.netsurf-browser.org/libnsgif.git"
  notes = ["Vendored in the libvips source tree (libvips/foreign/libnsgif, 'Last updated 22 Jan 2023'); upstream is unversioned."]
  evidence = { binary = true, text = "nsgif_* symbols and strings in libvips.so.42.17.2" }

