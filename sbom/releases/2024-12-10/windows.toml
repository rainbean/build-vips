# Windows x64 package of build 2024-12-10 (build-vips 7a7f992, submodule
# build-win64-mxe e949d29, decart 2.7.5).
#
# Only vips-dev-8.15/bin/ is distributed: decart's install.ps1 keeps bin/ as
# convert/ and deletes include/, lib/, share/ and etc/. Every file under bin/
# must match exactly one component's `files` globs, and every entry of the
# shipped versions.json must be claimed through `versions_key`; sbom.py fails
# otherwise. MXE itself was cloned from master unpinned, so the shipped files
# and versions.json are the authority, not the build tree.

[sbom]
name = "LibVIPS-win64"
version = "2024-12-10"
description = "libvips 8.15.2 with openslide 2024-12-10 and dependencies, Windows x64 (llvm-mingw, UCRT), as distributed in decart 2.7.5 (convert/)."
output = "SBOM-LibVIPS-win64-8.15.2-2024-12-10.cdx.json"

[archive]
file = "vips-w64-2024-12-10.zip"
url = "s3://build.aixmed.com/vips/vips-w64-2024-12-10.zip"
sha256 = "60faf33f43e3d2a6c1e1f1b485d629d9b10907907c0ea5a4d2e1b95a3502b684"
scope = "vips-dev-8.15/bin"
versions_json = "vips-dev-8.15/versions.json"

[properties]
build-win64-mxe-commit = "e949d2910d4de739a808739d527bcade7d27edec"
toolchain = "llvm-mingw 79e51a9, LLVM 18.1.1, UCRT (build-win64-mxe/build/plugins/llvm-mingw at e949d29)"

